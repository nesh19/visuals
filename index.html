<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technical Artist Portfolio | nesh19</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Consolas', monospace; color: white; height: 100vh; width: 100vw; background: radial-gradient(circle, #3a3a3a 0%, #0a0a0a 100%); touch-action: none; }
        #renderCanvas { width: 100%; height: 100%; display: block; z-index: 1; position: absolute; outline: none; background: transparent; }
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ff00; font-size: 16px; letter-spacing: 2px; }
        #nav-header { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(10, 10, 15, 0.85); padding: 8px; border-radius: 8px; border: 1px solid #444; backdrop-filter: blur(5px); z-index: 10; }
        .tab-btn { background: transparent; border: none; color: #888; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: 'Consolas', monospace; font-size: 12px; letter-spacing: 1px; transition: all 0.3s; }
        .tab-btn.active { background: #00ff00; color: #111; font-weight: bold; }
        #ui-toggle-btn { position: absolute; top: 70px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.8); border: 1px solid #444; border-radius: 8px; color: #aaa; padding: 10px 15px; font-family: 'Consolas', monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; }
        #left-container { position: absolute; top: 20px; left: 20px; z-index: 5; display: flex; flex-direction: column; gap: 15px; pointer-events: none; width: 90%; max-width: 250px; }
        #ui-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 15, 0.85); padding: 20px; border-radius: 10px; border: 1px solid #444; width: 90%; max-width: 320px; text-align: center; z-index: 5; backdrop-filter: blur(5px); }
        .panel-section { display: none; } .panel-section.active { display: block; }
        .panel-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; pointer-events: auto; }
        .stat-val { color: #00ff00; font-weight: bold; }
        #tex-gallery { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; pointer-events: auto;}
        .tex-box { width: 60px; height: 60px; border: 1px solid #444; background-color: #1a1a1a; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; }
        .tex-label { position: absolute; bottom: 0; left: 0; width: 100%; text-align: center; font-size: 8px; color: #ddd; background: rgba(0,0,0,0.8); padding: 3px 0; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        .face-slider { accent-color: #00ffcc !important; direction: rtl; } 
        #wireframe-btn { width: 100%; margin-top: 15px; padding: 8px; cursor: pointer; background: #222; color: #aaa; border: 1px solid #555; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 11px; }
    </style>
</head>
<body>
    <div id="loading-screen"><div>LOADING GEOMETRY...</div></div>
    <div id="nav-header">
        <button id="btn-stress" class="tab-btn active" onclick="switchSimulation('stress')">CORTISOL RESPONSE</button>
        <button id="btn-face" class="tab-btn" onclick="switchSimulation('face')">CRANIOFACIAL RESHAPING</button>
    </div>
    <button id="ui-toggle-btn">HIDE UI</button>
    <div id="left-container">
        <div id="stats-panel" class="panel-box"><strong>STATISTICS</strong><br>FPS: <span id="fps" class="stat-val">0</span><br>Total Tris: <span id="tris" class="stat-val">0</span></div>
        <div id="tex-gallery"></div>
    </div>
    <div id="ui-panel">
        <div id="stress-controls" class="panel-section active"><input type="range" id="stressSlider" min="0" max="1" step="0.01" value="0"></div>
        <div id="face-controls" class="panel-section"><input type="range" id="humpSlider" class="face-slider" min="0" max="1" step="0.01" value="1"></div>
        <button id="wireframe-btn">TOGGLE TOPOLOGY</button>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let currentScene = null;
        let isWireframe = false;

        const loadSimulation = async function (type) {
            if (currentScene) currentScene.dispose();
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
            scene.imageProcessingConfiguration.toneMappingEnabled = true;
            scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            
            const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/2, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
            
            const modelFilename = type === 'stress' ? "human_stress_v01.glb" : "anatomical-morph-viewer.glb";
            await BABYLON.SceneLoader.AppendAsync("./models/", modelFilename, scene);
            document.getElementById('loading-screen').style.display = 'none';

            if (type === 'stress') {
                let vagusMat = scene.materials.find(m => m.name && m.name.toLowerCase().includes("vagus"));
                const slider = document.getElementById("stressSlider");
                scene.onBeforeRenderObservable.add(() => {
                    const stressLevel = parseFloat(slider.value);
                    const stressColor = BABYLON.Color3.Lerp(new BABYLON.Color3(0.1, 0.4, 1.0), new BABYLON.Color3(1.0, 0.0, 0.0), stressLevel);
                    if (vagusMat) {
                        vagusMat.emissiveColor = stressColor;
                        vagusMat.emissiveIntensity = stressLevel * 4;
                    }
                });
            }
            currentScene = scene;
        };

        function switchSimulation(type) {
            document.getElementById('btn-stress').classList.toggle('active', type === 'stress');
            document.getElementById('btn-face').classList.toggle('active', type === 'face');
            document.querySelectorAll('.panel-section').forEach(p => p.classList.toggle('active', p.id === `${type}-controls`));
            loadSimulation(type);
        }
        loadSimulation('stress');
        engine.runRenderLoop(() => { if (currentScene) currentScene.render(); });
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
