<script>
        const uiToggleBtn = document.getElementById("ui-toggle-btn");
        const leftContainer = document.getElementById("left-container");
        const uiPanel = document.getElementById("ui-panel");
        let uiVisible = true;

        uiToggleBtn.addEventListener("click", () => {
            uiVisible = !uiVisible;
            if(uiVisible) {
                leftContainer.classList.remove("hidden");
                uiPanel.classList.remove("hidden");
                uiToggleBtn.innerText = "HIDE UI";
            } else {
                leftContainer.classList.add("hidden");
                uiPanel.classList.add("hidden");
                uiToggleBtn.innerText = "SHOW UI";
            }
        });

        const canvas = document.getElementById("renderCanvas");
        
        // Anti-aliasing enabled on the engine
        const engine = new BABYLON.Engine(canvas, true, { antialias: true, preserveDrawingBuffer: true, stencil: true });

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

            // Default Pipeline for MSAA and Tonemapping
            var defaultPipeline = new BABYLON.DefaultRenderingPipeline("defaultPipeline", true, scene, [scene.activeCamera]);
            defaultPipeline.samples = 4; 
            defaultPipeline.imageProcessingEnabled = true;
            defaultPipeline.imageProcessing.toneMappingEnabled = false;
            defaultPipeline.imageProcessing.exposure = 1.3;
            defaultPipeline.imageProcessing.contrast = 1;

            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 100; 
            camera.pinchPrecision = 200; 
            camera.minZ = 0.01; 
            camera.lowerRadiusLimit = 1.8; 
            camera.upperRadiusLimit = 20.0;
            
            defaultPipeline.cameras = [camera];

            scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
            scene.environmentIntensity = 1.0;

            const extraLight = new BABYLON.HemisphericLight("extraLight", new BABYLON.Vector3(0, 1, 0), scene);
            extraLight.intensity = 0.5; 
            extraLight.groundColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            const stressLight = new BABYLON.DirectionalLight("stressLight", new BABYLON.Vector3(-1, -2, -1), scene);
            stressLight.position = new BABYLON.Vector3(20, 40, 20);
            stressLight.diffuse = new BABYLON.Color3(1.0, 0.0, 0.0); 
            stressLight.intensity = 1; 

            try {
                // Ensure we are loading the .glb!
                await BABYLON.SceneLoader.AppendAsync("./models/", "human_stress_v01.glb", scene);
                
                // Hide loading screen safely
                document.getElementById('loading-screen').style.display = 'none';

                const worldExtends = scene.getWorldExtends();
                const center = worldExtends.min.add(worldExtends.max).scale(0.5);
                camera.setTarget(center);

                scene.executeWhenReady(() => {
                    camera.useFramingBehavior = true;
                    const framingBehavior = camera.getBehaviorByName("Framing");
                    if (framingBehavior) {
                        framingBehavior.framingTime = 0;
                        framingBehavior.elevationReturnTime = -1;
                        framingBehavior.zoomOnMeshesHierarchy(scene.meshes);
                    }

                    // Glass sorting fix
                    scene.meshes.forEach(mesh => {
                        if (mesh.material && mesh.material.name) {
                            const mName = mesh.material.name.toLowerCase();
                            if (mName.includes("glass") || mName.includes("body")) {
                                mesh.renderingGroupId = 1; 
                                mesh.material.forceDepthWrite = true;
                            } else {
                                mesh.renderingGroupId = 0; 
                            }
                        }
                    });
                });

                scene.materials.forEach(mat => {
                    if (mat instanceof BABYLON.PBRMaterial) {
                        const matName = mat.name ? mat.name.toLowerCase() : "";
                        if (!matName.includes("vagus") && !matName.includes("glass") && !matName.includes("body")) {
                            if (mat.metallicTexture) {
                                mat.ambientTexture = mat.metallicTexture;
                                mat.useAmbientOcclusionFromMetallicTextureRed = true;
                                mat.ambientTextureStrength = 1.0; 
                                mat.ambientTextureImpactOnAnalyticalLights = 1.0; 
                                mat.markDirty();
                            }
                        }
                    }
                });

                if (scene.animationGroups && scene.animationGroups.length > 0) {
                    scene.animationGroups.forEach(anim => anim.play(true));
                }

                let totalTris = 0;
                let totalVerts = 0;
                scene.meshes.forEach(m => {
                    totalVerts += m.getTotalVertices() || 0;
                    const indices = m.getIndices();
                    if (indices) totalTris += (indices.length / 3);
                });
                document.getElementById("tris").innerText = Math.round(totalTris).toLocaleString();
                document.getElementById("verts").innerText = totalVerts.toLocaleString();

                const modelUrl = "./models/human_stress_v01.glb";
                fetch(modelUrl, { method: 'HEAD' })
                    .then(res => {
                        const totalBytes = parseInt(res.headers.get('content-length') || 0, 10);
                        if (totalBytes > 0) {
                            document.getElementById("fileSize").innerText = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
                        } else {
                            document.getElementById("fileSize").innerText = "Ready";
                        }
                    })
                    .catch(() => { document.getElementById("fileSize").innerText = "Unknown"; });

                let vagusMat = scene.materials.find(m => m.name && (m.name.toLowerCase().includes("mat_vagus_glow") || m.name.toLowerCase().includes("vagus")));
                let originalVagusColor = new BABYLON.Color3(0, 0, 0);
                let originalVagusIntensity = 1.0;

                if (vagusMat) {
                    if (vagusMat.emissiveColor) originalVagusColor = vagusMat.emissiveColor.clone();
                    if (vagusMat.emissiveIntensity !== undefined) originalVagusIntensity = vagusMat.emissiveIntensity;
                }

                const gallery = document.getElementById("tex-gallery");
                const textureFiles = [
                    { file: "body_baseColor_512.jpg", full: "body_baseColor_512.jpg", label: "Base Color" },
                    { file: "body_normal_512.jpg", full: "body_normal_512.jpg", label: "Normal" },
                    { file: "body_occlusionRoughnessMetallic_512.jpg", full: "body_occlusionRoughnessMetallic_512.jpg", label: "ORM Map" }
                ];

                textureFiles.forEach(tex => {
                    let box = document.createElement("div");
                    box.className = "tex-box";
                    const previewPath = `./models/${tex.file}`;
                    const fullPath = `./models/${tex.full}`;
                    box.style.backgroundImage = `url('${previewPath}')`;
                    
                    box.onclick = (e) => {
                        e.stopPropagation(); 
                        document.getElementById('modal-img').src = fullPath + "?v=" + new Date().getTime();
                        document.getElementById('image-modal').style.display = 'flex';
                    };
                    
                    let label = document.createElement("div");
                    label.className = "tex-label";
                    label.innerText = tex.label;
                    box.appendChild(label);
                    gallery.appendChild(box);
                });

                const wireframeBtn = document.getElementById("wireframe-btn");
                let isWireframe = false;
                wireframeBtn.addEventListener("click", () => {
                    isWireframe = !isWireframe;
                    wireframeBtn.style.color = isWireframe ? "#00ff00" : "#aaa";
                    wireframeBtn.style.borderColor = isWireframe ? "#00ff00" : "#555";
                    scene.materials.forEach(mat => { if (mat) mat.wireframe = isWireframe; });
                });

                const aaSelect = document.getElementById("aaSelect");
                aaSelect.addEventListener("change", (e) => {
                    defaultPipeline.samples = parseInt(e.target.value);
                });

                const tonemapSelect = document.getElementById("tonemapSelect");
                const iblSlider = document.getElementById("iblSlider");
                const iblVal = document.getElementById("iblVal");

                tonemapSelect.addEventListener("change", (e) => {
                    if (e.target.value === "aces") {
                        defaultPipeline.imageProcessing.toneMappingEnabled = true;
                        defaultPipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
                    } else if (e.target.value === "standard") {
                        defaultPipeline.imageProcessing.toneMappingEnabled = true;
                        defaultPipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_STANDARD;
                    } else {
                        defaultPipeline.imageProcessing.toneMappingEnabled = false;
                    }
                });

                iblSlider.addEventListener("input", () => {
                    const val = parseFloat(iblSlider.value);
                    scene.environmentIntensity = val;
                    iblVal.innerText = val.toFixed(1);
                });

                const slider = document.getElementById("stressSlider");
                const fpsElem = document.getElementById("fps");

                scene.onBeforeRenderObservable.add(() => {
                    let currentFps = engine.getFps();
                    fpsElem.innerText = isFinite(currentFps) && currentFps > 0 ? currentFps.toFixed() : "60";
                    
                    const stressLevel = parseFloat(slider.value);

                    stressLight.intensity = stressLevel * 0.8; 

                    if (scene.animationGroups) {
                        const speed = 1.0 + (stressLevel * 3.0); 
                        scene.animationGroups.forEach(anim => anim.speedRatio = speed);
                    }

                    if (vagusMat) {
                        const peakColor = new BABYLON.Color3(1.0, 0.0, 0.0); 
                        vagusMat.emissiveColor = BABYLON.Color3.Lerp(originalVagusColor, peakColor, stressLevel);
                        
                        // We keep the high intensity multiplier so it still glows brightly
                        vagusMat.emissiveIntensity = originalVagusIntensity + (stressLevel * 50.0); 
                    }
                });

            } catch (error) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('crash-screen').style.display = 'block';
                console.error("LOAD ERROR:", error);
            }

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
