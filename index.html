<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Technical Artist Portfolio | nesh19</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Consolas', monospace; color: white;
            background: radial-gradient(circle, #BBBBBB 0%, #555555 100%); 
        }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; z-index: 1; position: absolute; }
        
        /* UI Panels */
        .ui-float {
            position: absolute; background: rgba(15, 15, 15, 0.9); padding: 15px; 
            border-radius: 8px; border: 1px solid #444; z-index: 5; backdrop-filter: blur(8px);
        }

        #stress-panel { bottom: 30px; left: 50%; transform: translateX(-50%); width: 320px; text-align: center; }
        #settings-panel { top: 20px; right: 20px; width: 220px; font-size: 11px; }

        label { display: block; margin-bottom: 5px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        select, input[type=range] { width: 100%; margin-bottom: 12px; cursor: pointer; accent-color: #ff4d4d; }
        select { background: #222; color: white; border: 1px solid #444; padding: 5px; }

        #wireframe-btn {
            width: 100%; padding: 8px; cursor: pointer; background: #222; color: #aaa; 
            border: 1px solid #555; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 10px;
        }

        /* Stats & Gallery */
        #left-container { position: absolute; top: 20px; left: 20px; z-index: 5; display: flex; flex-direction: column; gap: 15px; pointer-events: none;}
        #stats-panel { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border-left: 3px solid #00ff00; font-size: 11px; pointer-events: auto;}
        .stat-val { color: #00ff00; font-weight: bold; }

        #tex-gallery { display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; flex-wrap: wrap; max-width: 250px; pointer-events: auto;}
        .tex-box { width: 64px; height: 64px; border: 1px solid #444; border-radius: 4px; background-size: cover; position: relative; cursor: pointer; }
        .tex-label { position: absolute; bottom: 0; width: 100%; text-align: center; font-size: 8px; background: rgba(0,0,0,0.8); padding: 2px 0; }

        #image-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; 
        }
        #modal-img { max-width: 80%; max-height: 80%; border: 1px solid #444; }
        
        #crash-screen {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9); padding: 30px; border: 2px solid white; z-index: 9999;
            font-family: monospace; text-align: center; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="crash-screen">
        <h2 style="margin-top:0;">⚠️ LOAD FAILED</h2>
        <p>Check folder names and file case sensitivity.</p>
    </div>

    <div id="image-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <div id="left-container">
        <div id="stats-panel">
            <strong>PROJECT DATA</strong><br>
            FPS: <span id="fps" class="stat-val">0</span><br>
            Total Tris: <span id="tris" class="stat-val">0</span><br>
            Full Model Size: <span id="fileSize" class="stat-val">...</span>
        </div>
        <div id="tex-gallery"></div>
    </div>

    <div id="settings-panel" class="ui-float">
        <label>Tone Mapping</label>
        <select id="toneMapSelect">
            <option value="aces">ACES (Cinematic)</option>
            <option value="standard">Standard (Filmic)</option>
            <option value="none">None (Linear)</option>
        </select>

        <label>IBL Intensity</label>
        <input type="range" id="iblIntensity" min="0" max="4" step="0.1" value="1.5">

        <button id="wireframe-btn">TOGGLE TOPOLOGY</button>
    </div>

    <div id="stress-panel" class="ui-float">
        <strong style="color:#aaa; font-size: 12px; letter-spacing: 1px;">CORTISOL / STRESS</strong>
        <input type="range" id="stressSlider" min="0" max="1" step="0.01" value="0">
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // Transparent for CSS background

            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2.2, 4, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // Tone Mapping Setup
            scene.imageProcessingConfiguration.toneMappingEnabled = true;
            scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;

            // Environment Lighting (ONLY IBL)
            const envTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
            scene.environmentTexture = envTexture;
            scene.environmentIntensity = 1.5;

            try {
                // Load Model using your directory
                await BABYLON.SceneLoader.AppendAsync("./models/", "human_stress_v01.gltf", scene);
                camera.setTarget(scene.meshes[0] || BABYLON.Vector3.Zero());

                if (scene.animationGroups.length > 0) {
                    scene.animationGroups.forEach(anim => anim.play(true));
                }

                // Restore AO priority on all PBR materials
                scene.materials.forEach(mat => {
                    if (mat && mat.getTypeName() === "PBRMaterial") {
                        mat.occlusionStrength = 1.0;
                        mat.useAmbientOcclusionFromMetallicTexture = true;
                    }
                });

                // Calculate Tris
                let totalTris = 0;
                scene.meshes.forEach(m => {
                    const indices = m.getIndices();
                    if (indices) totalTris += (indices.length / 3);
                });
                document.getElementById("tris").innerText = Math.round(totalTris).toLocaleString();

                // Calculate Combined File Size (gltf + bin)
                const modelFiles = ["./models/human_stress_v01.gltf", "./models/human_stress_v01.bin"];
                let totalSize = 0;
                for (const url of modelFiles) {
                    try {
                        const response = await fetch(url, { method: 'HEAD' });
                        totalSize += parseInt(response.headers.get('content-length') || 0);
                    } catch(e) { console.error("File size error:", e); }
                }
                document.getElementById("fileSize").innerText = (totalSize / (1024 * 1024)).toFixed(2) + " MB";

                let vagusMat = scene.materials.find(m => m.name && m.name.toLowerCase().includes("vagus"));

                // Texture Previews using your 512px files
                const gallery = document.getElementById("tex-gallery");
                const textureFiles = [
                    { file: "body_baseColor_512.jpg", label: "Diffuse" },
                    { file: "body_normal_512.jpg", label: "Normal" },
                    { file: "body_occlusionRoughnessMetallic_512.jpg", label: "ORM" }
                ];

                textureFiles.forEach(tex => {
                    let box = document.createElement("div");
                    box.className = "tex-box";
                    box.style.backgroundImage = `url('./models/${tex.file}')`;
                    box.onclick = () => {
                        document.getElementById('modal-img').src = `./models/${tex.file}`;
                        document.getElementById('image-modal').style.display = 'flex';
                    };
                    let label = document.createElement("div");
                    label.className = "tex-label";
                    label.innerText = tex.label;
                    box.appendChild(label);
                    gallery.appendChild(box);
                });

                // UI LISTENERS - Fixes the "not working" issue
                document.getElementById("toneMapSelect").onchange = (e) => {
                    const val = e.target.value;
                    if (val === "none") {
                        scene.imageProcessingConfiguration.toneMappingEnabled = false;
                    } else {
                        scene.imageProcessingConfiguration.toneMappingEnabled = true;
                        scene.imageProcessingConfiguration.toneMappingType = (val === "aces") ? 
                            BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES : 
                            BABYLON.ImageProcessingConfiguration.TONEMAPPING_STANDARD;
                    }
                };

                document.getElementById("iblIntensity").oninput = (e) => {
                    scene.environmentIntensity = parseFloat(e.target.value);
                };

                const wireBtn = document.getElementById("wireframe-btn");
                let isWire = false;
                wireBtn.onclick = () => {
                    isWire = !isWire;
                    scene.materials.forEach(m => { if(m) m.wireframe = isWire; });
                };

                const slider = document.getElementById("stressSlider");
                scene.onBeforeRenderObservable.add(() => {
                    document.getElementById("fps").innerText = engine.getFps().toFixed();
                    const stress = parseFloat(slider.value);

                    if (scene.animationGroups) {
                        scene.animationGroups.forEach(anim => anim.speedRatio = 1.0 + (stress * 3.0));
                    }

                    if (vagusMat) {
                        if (stress > 0) {
                            vagusMat.emissiveColor = BABYLON.Color3.Lerp(new BABYLON.Color3(0.1, 0.3, 1.0), new BABYLON.Color3(1, 0, 0), stress);
                            vagusMat.emissiveIntensity = 2.0 + (stress * 15.0);
                        } else {
                            vagusMat.emissiveIntensity = 0;
                        }
                    }
                });

            } catch (err) { 
                document.getElementById('crash-screen').style.display = 'block';
                console.error(err); 
            }
            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => scene.render());
        });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
