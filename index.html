    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technical Artist Portfolio | nesh19</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Consolas', monospace; color: white; height: 100vh; width: 100vw;
            background: radial-gradient(circle, #3a3a3a 0%, #0a0a0a 100%); 
            touch-action: none; 
        }
        #renderCanvas { width: 100%; height: 100%; display: block; z-index: 1; position: absolute; outline: none; background: transparent; }
        
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00ff00;
            font-size: 16px; letter-spacing: 2px;
        }

        /* UI TOGGLE BUTTON */
        #ui-toggle-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.8); border: 1px solid #444; border-radius: 8px;
            color: #aaa; padding: 10px 15px; font-family: 'Consolas', monospace; font-size: 11px;
            cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px;
        }
        #ui-toggle-btn:hover { color: #fff; border-color: #888; }

        /* BASE UI STYLES WITH ANIMATIONS */
        #left-container {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            display: flex; flex-direction: column; gap: 15px; pointer-events: none; width: 90%; max-width: 250px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease;
        }

        #ui-panel { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(15, 15, 15, 0.85); padding: 20px; border-radius: 10px; 
            border: 1px solid #444; width: 90%; max-width: 320px; text-align: center; z-index: 5; backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease;
        }

        /* HIDDEN STATES */
        #left-container.hidden { transform: translateX(-150%) !important; opacity: 0; pointer-events: none; }
        #ui-panel.hidden { transform: translate(-50%, 150%) !important; opacity: 0; pointer-events: none; }

        .panel-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; pointer-events: auto; }
        
        #stats-panel { border-left: 3px solid #00ff00; font-size: 12px; line-height: 1.5; }
        .stat-val { color: #00ff00; font-weight: bold; }

        #tex-gallery { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; pointer-events: auto;}
        .tex-box { 
            width: 60px; height: 60px; border: 1px solid #444; background-color: #1a1a1a; 
            border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center;
            background-size: cover; background-position: center; cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .tex-box:hover { border-color: #fff; transform: scale(1.05); }
        .tex-label {
            position: absolute; bottom: 0; left: 0; width: 100%; text-align: center;
            font-size: 8px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: rgba(0,0,0,0.8); padding: 3px 0;
        }

        .slider-group { margin-top: 15px; text-align: left; }
        .slider-label { font-size: 10px; color: #aaa; letter-spacing: 1px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider-val { color: #00ff00; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        select { width: 100%; background: #222; color: white; border: 1px solid #555; padding: 6px; font-family: 'Consolas', monospace; border-radius: 4px; cursor: pointer; font-size: 11px;}
        
        #iblSlider { accent-color: #4da6ff; }

        #wireframe-btn {
            width: 100%; margin-top: 15px; padding: 8px; cursor: pointer;
            background: #222; color: #aaa; border: 1px solid #555;
            border-radius: 4px; font-family: 'Consolas', monospace; font-size: 11px;
            letter-spacing: 1px; transition: all 0.2s ease;
        }
        #wireframe-btn:hover { background: #444; color: #fff; border-color: #888; }
