<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technical Artist Portfolio | nesh19</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Consolas', monospace; color: white;
            background: radial-gradient(circle, #777777 0%, #333333 100%); 
            touch-action: none; 
        }
        #renderCanvas { width: 100%; height: 100%; display: block; z-index: 1; position: absolute; outline: none; background: transparent; }
        
        /* MOBILE RESPONSIVE UI */
        #left-container {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none; 
            width: 90%; max-width: 260px;
        }

        .panel-box { background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; pointer-events: auto; backdrop-filter: blur(5px); border: 1px solid #444; }
        
        #stats-panel { border-left: 3px solid #00ff00; font-size: 11px; line-height: 1.5; }
        .stat-val { color: #00ff00; font-weight: bold; }

        #tex-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
        .tex-box { 
            width: 60px; height: 60px; border: 1px solid #444; background-color: #1a1a1a; 
            border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center;
            background-size: cover; background-position: center; cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .tex-box:hover { border-color: #fff; transform: scale(1.05); }
        .tex-label {
            position: absolute; bottom: 0; left: 0; width: 100%; text-align: center;
            font-size: 8px; color: #ddd; background: rgba(0,0,0,0.8); padding: 2px 0;
        }

        #ui-panel { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(15, 15, 15, 0.85); padding: 20px; border-radius: 10px; 
            border: 1px solid #444; width: 90%; max-width: 320px; text-align: center; z-index: 5; backdrop-filter: blur(5px);
        }
        
        .slider-group { margin-top: 15px; text-align: left; }
        .slider-label { font-size: 10px; color: #aaa; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .slider-val { color: #00ff00; }
        input[type=range] { width: 100%; margin-top: 5px; cursor: pointer; accent-color: #ff4d4d; }
        select { width: 100%; background: #222; color: white; border: 1px solid #555; padding: 6px; margin-top: 5px; font-family: 'Consolas', monospace; border-radius: 4px; cursor: pointer; font-size: 11px;}

        #wireframe-btn {
            width: 100%; margin-top: 15px; padding: 8px; cursor: pointer;
            background: #222; color: #aaa; border: 1px solid #555;
            border-radius: 4px; font-family: 'Consolas', monospace; font-size: 11px;
        }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; cursor: pointer;
        }
        #modal-img { max-width: 90vw; max-height: 80vh; border: 2px solid #555; border-radius: 8px; }

        /* MOBILE MEDIA QUERIES */
        @media (max-width: 600px) {
            #left-container { top: 10px; left: 50%; transform: translateX(-50%); width: 95%; }
            #lighting-controls { display: none; } /* Hide secondary controls on small phones */
            .tex-box { width: 50px; height: 50px; }
            #ui-panel { bottom: 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="image-modal" onclick="this.style.display='none'"><img id="modal-img" src=""></div>

    <div id="left-container">
        <div id="stats-panel" class="panel-box">
            <strong>STATISTICS</strong><br>
            FPS: <span id="fps" class="stat-val">0</span> | Tris: <span id="tris" class="stat-val">0</span><br>
            Verts: <span id="verts" class="stat-val">0</span> | Total Size: <span id="fileSize" class="stat-val">...</span>
        </div>
        
        <div id="tex-gallery" class="panel-box"></div>

        <div id="lighting-controls" class="panel-box" style="border-left: 3px solid #ffb84d;">
            <div class="slider-group" style="margin-top: 0;">
                <div class="slider-label">TONEMAPPING</div>
                <select id="tonemapSelect">
                    <option value="aces" selected>ACES (Cinematic)</option>
                    <option value="standard">Standard (Filmic)</option>
                    <option value="none">None (Linear)</option>
                </select>
            </div>
            <div class="slider-group">
                <div class="slider-label">ENV IBL <span id="iblVal" class="slider-val">1.0</span></div>
                <input type="range" id="iblSlider" min="0" max="3" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <div class="slider-label">EXPOSURE <span id="expVal" class="slider-val">1.0</span></div>
                <input type="range" id="expSlider" min="0.1" max="4" step="0.1" value="1.0">
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <div class="slider-group" style="margin-top: 0;">
            <div class="slider-label">CORTISOL / STRESS</div>
            <input type="range" id="stressSlider" min="0" max="1" step="0.01" value="0">
        </div>
        <button id="wireframe-btn">TOGGLE TOPOLOGY</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

            // Setup Tonemapping
            scene.imageProcessingConfiguration.toneMappingEnabled = true;
            scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            scene.imageProcessingConfiguration.exposure = 1.0; 

            // Camera Setup with Soft Zoom
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2, 3, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 150; 
            camera.inertia = 0.9; 
            camera.minZ = 0.01; // Closer near-clipping plane
            camera.lowerRadiusLimit = 1.5; 
            camera.upperRadiusLimit = 10.0;

            // Environment Light (IBL)
            scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
            scene.environmentIntensity = 1.0;

            // Hemispheric Lift (Prevents absolute black shadows)
            const liftLight = new BABYLON.HemisphericLight("liftLight", new BABYLON.Vector3(0, 1, 0), scene);
            liftLight.intensity = 0.2;

            // Stress Tint Light
            const stressLight = new BABYLON.DirectionalLight("stressLight", new BABYLON.Vector3(-1, -2, -1), scene);
            stressLight.intensity = 0.0; 
            stressLight.diffuse = new BABYLON.Color3(1, 0, 0);

            try {
                await BABYLON.SceneLoader.AppendAsync("./models/", "human_stress_v01.gltf", scene);
                
                camera.setTarget(scene.meshes[0]);

                // --- AO FORCE ASSERTION (Fixes missing shadows) ---
                scene.materials.forEach(mat => {
                    if (mat instanceof BABYLON.PBRMaterial) {
                        const matName = mat.name ? mat.name.toLowerCase() : "";
                        if (!matName.includes("vagus") && !matName.includes("glass")) {
                            if (mat.metallicTexture) {
                                mat.ambientTexture = mat.metallicTexture;
                                mat.useAmbientOcclusionFromMetallicTextureRed = true;
                                mat.ambientTextureStrength = 1.5; 
                                mat.ambientTextureImpactOnAnalyticalLights = 1.0;
                                mat.markDirty(); 
                            }
                        }
                    }
                });

                if (scene.animationGroups.length > 0) scene.animationGroups.forEach(anim => anim.play(true));

                // Stats Calculation
                let totalTris = 0, totalVerts = 0;
                scene.meshes.forEach(m => {
                    totalVerts += m.getTotalVertices() || 0;
                    const indices = m.getIndices();
                    if (indices) totalTris += (indices.length / 3);
                });
                document.getElementById("tris").innerText = Math.round(totalTris).toLocaleString();
                document.getElementById("verts").innerText = totalVerts.toLocaleString();

                // --- TOTAL SIZE CALCULATION (Smart Ping) ---
                const files = [
                    "./models/human_stress_v01.bin",
                    "./models/body_baseColor.jpg",
                    "./models/body_normal.jpg",
                    "./models/body_occlusionRoughnessMetallic.jpg"
                ];
                Promise.all(files.map(url => fetch(url, { method: 'HEAD' }).then(res => parseInt(res.headers.get('content-length') || 0, 10)).catch(() => 0)))
                .then(sizes => {
                    const totalBytes = sizes.reduce((a, b) => a + b, 0);
                    document.getElementById("fileSize").innerText = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
                });

                let vagusMat = scene.materials.find(m => m.name && m.name.toLowerCase().includes("vagus"));
                let originalVagusColor = (vagusMat && vagusMat.emissiveColor) ? vagusMat.emissiveColor.clone() : new BABYLON.Color3(0.1, 0.3, 1.0);
                let originalVagusIntensity = vagusMat ? (vagusMat.emissiveIntensity || 2.0) : 2.0;

                // Build Responsive Gallery
                const gallery = document.getElementById("tex-gallery");
                const textureFiles = [
                    { file: "body_baseColor_512.jpg", full: "body_baseColor.jpg", label: "Diffuse" },
                    { file: "body_normal_512.jpg", full: "body_normal.jpg", label: "Normal" },
                    { file: "body_occlusionRoughnessMetallic_512.jpg", full: "body_occlusionRoughnessMetallic.jpg", label: "ORM" }
                ];
                textureFiles.forEach(tex => {
                    let box = document.createElement("div");
                    box.className = "tex-box";
                    box.style.backgroundImage = `url('./models/${tex.file}')`;
                    box.onclick = () => { 
                        document.getElementById('modal-img').src = `./models/${tex.full}`; 
                        document.getElementById('image-modal').style.display = 'flex'; 
                    };
                    let label = document.createElement("div");
                    label.className = "tex-label"; label.innerText = tex.label;
                    box.appendChild(label); gallery.appendChild(box);
                });

                // UI Listeners
                const stressSlider = document.getElementById("stressSlider");
                const tonemapSelect = document.getElementById("tonemapSelect");
                const iblSlider = document.getElementById("iblSlider");
                const expSlider = document.getElementById("expSlider");

                tonemapSelect.addEventListener("change", (e) => {
                    scene.imageProcessingConfiguration.toneMappingEnabled = e.target.value !== "none";
                    if(e.target.value === "aces") scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
                    if(e.target.value === "standard") scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_STANDARD;
                });

                iblSlider.oninput = () => { scene.environmentIntensity = parseFloat(iblSlider.value); document.getElementById("iblVal").innerText = parseFloat(iblSlider.value).toFixed(1); };
                expSlider.oninput = () => { scene.imageProcessingConfiguration.exposure = parseFloat(expSlider.value); document.getElementById("expVal").innerText = parseFloat(expSlider.value).toFixed(1); };

                document.getElementById("wireframe-btn").onclick = function() {
                    this.isWire = !this.isWire;
                    this.style.color = this.isWire ? "#00ff00" : "#aaa";
                    scene.materials.forEach(mat => { if (mat) mat.wireframe = this.isWire; });
                };

                scene.onBeforeRenderObservable.add(() => {
                    document.getElementById("fps").innerText = engine.getFps().toFixed();
                    const stress = parseFloat(stressSlider.value);
                    let lerp = stress > 0.33 ? (stress - 0.33) / 0.67 : 0;
                    stressLight.intensity = stress * 0.5;
                    if (scene.animationGroups) scene.animationGroups.forEach(a => a.speedRatio = 1.0 + (stress * 3.0));
                    if (vagusMat) {
                        vagusMat.emissiveColor = BABYLON.Color3.Lerp(originalVagusColor, new BABYLON.Color3(0.8, 0, 0), lerp);
                        vagusMat.emissiveIntensity = originalVagusIntensity + (lerp * 15.0);
                    }
                });

            } catch (error) { console.error("LOAD ERROR:", error); }
            return scene;
        };

        createScene().then(scene => { engine.runRenderLoop(() => scene.render()); });
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
