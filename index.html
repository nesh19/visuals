<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technical Artist Portfolio | nesh19</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Consolas', monospace; color: white;
            /* Light gray center to dark gray edges vignette */
            background: radial-gradient(circle, #888888 0%, #222222 100%); 
            touch-action: none; 
        }
        #renderCanvas { width: 100%; height: 100%; display: block; z-index: 1; position: absolute; outline: none; background: transparent; }
        
        #ui-panel { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(15, 15, 15, 0.85); padding: 20px; border-radius: 10px; 
            border: 1px solid #444; width: 90%; max-width: 320px; text-align: center; z-index: 5; backdrop-filter: blur(5px);
        }
        
        #left-container {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            display: flex; flex-direction: column; gap: 15px; pointer-events: none; width: 90%; max-width: 250px;
        }

        .panel-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; pointer-events: auto; }
        
        #stats-panel { border-left: 3px solid #00ff00; font-size: 12px; line-height: 1.5; }
        .stat-val { color: #00ff00; font-weight: bold; }

        #tex-gallery { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; pointer-events: auto;}
        .tex-box { 
            width: 60px; height: 60px; border: 1px solid #444; background-color: #1a1a1a; 
            border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center;
            background-size: cover; background-position: center; cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .tex-box:hover { border-color: #fff; transform: scale(1.05); }
        .tex-label {
            position: absolute; bottom: 0; left: 0; width: 100%; text-align: center;
            font-size: 8px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: rgba(0,0,0,0.8); padding: 3px 0;
        }

        .slider-group { margin-top: 15px; text-align: left; }
        .slider-label { font-size: 10px; color: #aaa; letter-spacing: 1px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider-val { color: #00ff00; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        select { width: 100%; background: #222; color: white; border: 1px solid #555; padding: 6px; font-family: 'Consolas', monospace; border-radius: 4px; cursor: pointer; font-size: 11px;}
        
        #iblSlider { accent-color: #4da6ff; }

        #wireframe-btn {
            width: 100%; margin-top: 15px; padding: 8px; cursor: pointer;
            background: #222; color: #aaa; border: 1px solid #555;
            border-radius: 4px; font-family: 'Consolas', monospace; font-size: 11px;
            letter-spacing: 1px; transition: all 0.2s ease;
        }
        #wireframe-btn:hover { background: #444; color: #fff; border-color: #888; }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 1000;
            justify-content: center; align-items: center; flex-direction: column;
            cursor: pointer; backdrop-filter: blur(5px); pointer-events: auto;
        }
        #modal-img { max-width: 90vw; max-height: 80vh; border: 2px solid #555; border-radius: 8px; }
        
        #crash-screen {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9); padding: 30px; border: 2px solid white; z-index: 9999;
            font-family: monospace; text-align: center; border-radius: 8px; pointer-events: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #ui-panel { bottom: 15px; padding: 15px; }
            #left-container { top: 10px; left: 10px; flex-direction: row; flex-wrap: wrap; width: calc(100% - 20px); max-width: 100%; justify-content: space-between; }
            #stats-panel, #lighting-controls { width: 100%; box-sizing: border-box; }
            #tex-gallery { width: 100%; box-sizing: border-box; }
            .tex-box { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div id="crash-screen">
        <h2 style="margin-top:0;">⚠️ MODEL LOAD FAILED</h2>
        <p id="crash-log">Check your models folder. Are filenames case-sensitive?</p>
    </div>

    <div id="image-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="" alt="Texture Preview">
        <div style="margin-top: 15px; color: #aaa; font-size: 12px; letter-spacing: 1px;">CLICK ANYWHERE TO CLOSE</div>
    </div>

    <div id="left-container">
        <div id="stats-panel" class="panel-box">
            <strong>STATISTICS</strong><br>
            FPS: <span id="fps" class="stat-val">0</span><br>
            Total Tris: <span id="tris" class="stat-val">0</span><br>
            Total Verts: <span id="verts" class="stat-val">0</span><br>
            Total Size: <span id="fileSize" class="stat-val">Calculating...</span>
        </div>
        
        <div id="tex-gallery"></div>

        <div id="lighting-controls" class="panel-box" style="border-left: 3px solid #4da6ff;">
            <div class="slider-group" style="margin-top: 0;">
                <div class="slider-label">TONEMAPPING</div>
                <select id="tonemapSelect">
                    <option value="aces" selected>ACES (Cinematic)</option>
                    <option value="standard">Standard (Filmic)</option>
                    <option value="none">None (Linear)</option>
                </select>
            </div>
            <div class="slider-group" style="margin-top: 12px;">
                <div class="slider-label"><span>ENVIRONMENT IBL</span> <span id="iblVal" class="slider-val">1.0</span></div>
                <input type="range" id="iblSlider" min="0" max="3" step="0.1" value="1.0">
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <div class="slider-group" style="margin-top: 0;">
            <div class="slider-label" style="justify-content: center;"><span>CORTISOL / STRESS</span></div>
            <input type="range" id="stressSlider" min="0" max="1" step="0.01" value="0">
        </div>
        <button id="wireframe-btn">TOGGLE TOPOLOGY</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

            // Base Image Processing
            scene.imageProcessingConfiguration.toneMappingEnabled = true;
            scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            scene.imageProcessingConfiguration.exposure = 1.3;
            scene.imageProcessingConfiguration.contrast = 1.2;

            // --- CAMERA FIXES ---
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 100;
            
            // Stops zooming through model
            camera.minZ = 0.01; 
            camera.lowerRadiusLimit = 1.8; 
            camera.upperRadiusLimit = 20.0;

            // --- LIGHTING ---
            // 1. Environment IBL
            scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
            scene.environmentIntensity = 1.0;

            // 2. Extra Fill Light (New)
            const extraLight = new BABYLON.HemisphericLight("extraLight", new BABYLON.Vector3(0, 1, 0), scene);
            extraLight.intensity = 0.3; // Kept low to not kill shadows
            extraLight.groundColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            // 3. Stress Directional Light
            const stressLight = new BABYLON.DirectionalLight("stressLight", new BABYLON.Vector3(-1, -2, -1), scene);
            stressLight.position = new BABYLON.Vector3(20, 40, 20);
            stressLight.diffuse = new BABYLON.Color3(1.0, 0.0, 0.0); 
            stressLight.intensity = 0.0; 

            try {
                await BABYLON.SceneLoader.AppendAsync("./models/", "human_stress_v01.gltf", scene);
                
                // Calculates the true center of the geometry
                const worldExtends = scene.getWorldExtends();
                const center = worldExtends.min.add(worldExtends.max).scale(0.5);
                camera.setTarget(center);

                // Auto-Framing prevents the "too far" look initially
                scene.executeWhenReady(() => {
                    camera.useFramingBehavior = true;
                    const framingBehavior = camera.getBehaviorByName("Framing");
                    if (framingBehavior) {
                        framingBehavior.framingTime = 0; // Instant snap
                        framingBehavior.elevationReturnTime = -1;
                        framingBehavior.zoomOnMeshesHierarchy(scene.meshes);
                    }
                });

                // Ambient Occlusion Mapping
                scene.materials.forEach(mat => {
                    if (mat instanceof BABYLON.PBRMaterial) {
                        const matName = mat.name ? mat.name.toLowerCase() : "";
                        if (!matName.includes("vagus") && !matName.includes("glass")) {
                            if (mat.metallicTexture) {
                                mat.ambientTexture = mat.metallicTexture;
                                mat.useAmbientOcclusionFromMetallicTextureRed = true;
                                mat.ambientTextureStrength = 1.0; // Fixed at 1.0 limit
                                mat.ambientTextureImpactOnAnalyticalLights = 1.0; // Keeps AO intact under our extra light
                                mat.markDirty();
                            }
                        }
                    }
                });

                if (scene.animationGroups && scene.animationGroups.length > 0) {
                    scene.animationGroups.forEach(anim => anim.play(true));
                }

                // Stats Panel
                let totalTris = 0;
                let totalVerts = 0;
                scene.meshes.forEach(m => {
                    totalVerts += m.getTotalVertices() || 0;
                    const indices = m.getIndices();
                    if (indices) totalTris += (indices.length / 3);
                });
                document.getElementById("tris").innerText = Math.round(totalTris).toLocaleString();
                document.getElementById("verts").innerText = totalVerts.toLocaleString();

                const filesToSize = [
                    "./models/human_stress_v01.bin",
                    "./models/body_baseColor.jpg",
                    "./models/body_normal.jpg",
                    "./models/body_occlusionRoughnessMetallic.jpg"
                ];
                Promise.all(filesToSize.map(url => 
                    fetch(url, { method: 'HEAD' })
                        .then(res => parseInt(res.headers.get('content-length') || 0, 10))
                        .catch(() => 0)
                )).then(sizes => {
                    const totalBytes = sizes.reduce((a, b) => a + b, 0);
                    if (totalBytes > 0) {
                        document.getElementById("fileSize").innerText = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
                    } else {
                        document.getElementById("fileSize").innerText = "Ready";
                    }
                });

                // Vagus Setup & Original Material Capture
                let vagusMat = scene.materials.find(m => m.name && m.name.toLowerCase().includes("vagus"));
                let originalVagusColor = new BABYLON.Color3(0, 0, 0);
                let originalVagusIntensity = 1.0;

                if (vagusMat) {
                    if (vagusMat.emissiveColor) originalVagusColor = vagusMat.emissiveColor.clone();
                    if (vagusMat.emissiveIntensity !== undefined) originalVagusIntensity = vagusMat.emissiveIntensity;
                }

                // Texture Gallery Builder
                const gallery = document.getElementById("tex-gallery");
                const textureFiles = [
                    { file: "body_baseColor_512.jpg", full: "body_baseColor.jpg", label: "Base Color" },
                    { file: "body_normal_512.jpg", full: "body_normal.jpg", label: "Normal" },
                    { file: "body_occlusionRoughnessMetallic_512.jpg", full: "body_occlusionRoughnessMetallic.jpg", label: "ORM Map" }
                ];

                textureFiles.forEach(tex => {
                    let box = document.createElement("div");
                    box.className = "tex-box";
                    const previewPath = `./models/${tex.file}`;
                    const fullPath = `./models/${tex.full}`;
                    box.style.backgroundImage = `url('${previewPath}')`;
                    box.onclick = () => {
                        document.getElementById('modal-img').src = fullPath;
                        document.getElementById('image-modal').style.display = 'flex';
                    };
                    let label = document.createElement("div");
                    label.className = "tex-label";
                    label.innerText = tex.label;
                    box.appendChild(label);
                    gallery.appendChild(box);
                });

                // Wireframe Logic
                const wireframeBtn = document.getElementById("wireframe-btn");
                let isWireframe = false;
                wireframeBtn.addEventListener("click", () => {
                    isWireframe = !isWireframe;
                    wireframeBtn.style.color = isWireframe ? "#00ff00" : "#aaa";
                    wireframeBtn.style.borderColor = isWireframe ? "#00ff00" : "#555";
                    scene.materials.forEach(mat => { if (mat) mat.wireframe = isWireframe; });
                });

                // UI Lighting Controls
                const tonemapSelect = document.getElementById("tonemapSelect");
                const iblSlider = document.getElementById("iblSlider");
                const iblVal = document.getElementById("iblVal");

                tonemapSelect.addEventListener("change", (e) => {
                    if (e.target.value === "aces") {
                        scene.imageProcessingConfiguration.toneMappingEnabled = true;
                        scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
                    } else if (e.target.value === "standard") {
                        scene.imageProcessingConfiguration.toneMappingEnabled = true;
                        scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_STANDARD;
                    } else {
                        scene.imageProcessingConfiguration.toneMappingEnabled = false;
                    }
                });

                iblSlider.addEventListener("input", () => {
                    const val = parseFloat(iblSlider.value);
                    scene.environmentIntensity = val;
                    iblVal.innerText = val.toFixed(1);
                });

                // Render Loop & Stress Slider
                const slider = document.getElementById("stressSlider");
                const fpsElem = document.getElementById("fps");

                scene.onBeforeRenderObservable.add(() => {
                    let currentFps = engine.getFps();
                    fpsElem.innerText = isFinite(currentFps) && currentFps > 0 ? currentFps.toFixed() : "60";
                    
                    const stressLevel = parseFloat(slider.value);

                    stressLight.intensity = stressLevel * 0.8; // Adjusted multiplier so it's zero when slider is at zero

                    if (scene.animationGroups) {
                        const speed = 1.0 + (stressLevel * 3.0); 
                        scene.animationGroups.forEach(anim => anim.speedRatio = speed);
                    }

                    // Vagus Material Lerp from Native to Pure Red
                    if (vagusMat) {
                        const peakColor = new BABYLON.Color3(0.8, 0.0, 0.0); // Zero Blue
                        vagusMat.emissiveColor = BABYLON.Color3.Lerp(originalVagusColor, peakColor, stressLevel);
                        vagusMat.emissiveIntensity = originalVagusIntensity + (stressLevel * 15.0); 
                    }
                });

            } catch (error) {
                document.getElementById('crash-screen').style.display = 'block';
                console.error("LOAD ERROR:", error);
            }

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
