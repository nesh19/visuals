<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cortisol Response | nesh19</title>
    
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://preview.babylonjs.com/ktx2Decoder/babylon.ktx2Decoder.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div>LOADING GEOMETRY & TEXTURES...</div>
        <div style="font-size: 10px; color: var(--dim-blue); margin-top: 10px;">Please wait</div>
    </div>

    <div id="crash-screen">
        <h2 style="margin-top:0;">⚠️ MODEL LOAD FAILED</h2>
        <p id="crash-log">Check your models folder.</p>
    </div>

    <div id="mobile-top-bar"> 
        <div class="mobile-actions">
            <a href="../index.html" class="mobile-nav-btn" id="mobile-back-btn">[BACK]</a>
            <button class="mobile-nav-btn" id="mobile-info-btn">[INFO]</button>
            <button class="mobile-nav-btn" id="mobile-stats-btn">[STATS]</button>
        </div>
    </div>

    <!-- GLAVNI LEVI KONTEJNER -->
    <div id="left-container" class="cortisol-layout">
        
        <a href="../index.html" class="tech-link mobile-hide" style="display: inline-block; margin-bottom: 40px; font-size: 0.85rem; letter-spacing: 1px; text-decoration: none; opacity: 0.7;">
            [BACK]
        </a>

        <!-- SEKCIJA 1: STATISTIKA I SFERA -->
        <div id="panel-stats" class="panel-box tech-text">
            
            <div id="stats-panel" class="mobile-popover" style="display: flex; flex-direction: column; gap: 6px;">
                <strong class="mobile-hide">STATISTICS</strong>
                <div>FPS: <span id="fps" class="stat-val">0</span></div>
                <div>Total Tris: <span id="tris" class="stat-val">0</span></div>
                <div>Total Verts: <span id="verts" class="stat-val">0</span></div>
                <div>Total Size: <span id="fileSize" class="stat-val">Calculating...</span></div>
            </div>
            
            <div id="wireframe-btn" class="geometry-trigger" style="margin-top: 24px; margin-bottom: 10px; cursor: pointer; pointer-events: auto; width: fit-content;">
                <div class="wireframe-sphere-mesh">
                    <div class="sphere-ring ring-h"></div>
                    <div class="sphere-ring ring-v1"></div>
                    <div class="sphere-ring ring-v2"></div>
                </div>
            </div>
        </div> 

        <!-- SEKCIJA 2: SLAJDERI I ANOTACIJE -->
        <div id="panel-sliders" class="panel-box">
            <div id="stress-controls" class="panel-section active" style="position: relative;">
                <div id="slider-wrapper">
                    <div class="slider-group" style="margin-top: 0; position: relative;">
                        <div class="slider-label" style="justify-content: flex-start; color: var(--danger-red); letter-spacing: 1px; font-weight: bold; margin-bottom: 8px;">HPA AXIS ACTIVATION</div>
                        <input type="range" id="stressSlider" class="stress-slider" min="0" max="1" step="0.001" value="0" style="position: relative; z-index: 2;">
                        
                   </div>
                </div>

                <!-- Asynchronous Teletype Dynamic Notation Subsystem -->
                <div id="annotation-container" class="hologram-text-container" style="display: none; position: relative; bottom: auto; left: auto; width: 100%; margin-top: 20px;">
                    <div id="anno-title" class="hologram-title" style="color: var(--danger-red); text-shadow: 0 0 6px var(--danger-glow);">Naslov</div>
                    <p id="anno-text" class="hologram-description" style="margin-bottom: 20px;">Tekst...</p>
                    <button id="anno-unlock-btn" class="tech-test" style="width: 100%;">CONTINUE -></button>
                </div>
            </div>
        </div>

        <!-- SEKCIJA 3: INFO PANEL (Sada je ispravno unutar strukture, a CSS ga pretvara u mobilni pop-up) -->
        <div id="info-panel" class="project-metadata-log mobile-popover" style="opacity: 0.85; font-size: 0.75rem; line-height: 1.6; color: var(--dim-blue);">
            <span id="type-body"></span>
        </div>

    </div> 

    <canvas id="renderCanvas"></canvas>

    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
