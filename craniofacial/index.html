<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Craniofacial Reshaping | nesh19</title>
    
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://preview.babylonjs.com/ktx2Decoder/babylon.ktx2Decoder.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div>LOADING GEOMETRY & TEXTURES...</div>
        <div style="font-size: 10px; color: var(--dim-blue); margin-top: 10px;">Please wait</div>
    </div>

    <div id="crash-screen">
        <h2 style="margin-top:0;">⚠️ MODEL LOAD FAILED</h2>
        <p id="crash-log">Check your models folder.</p>
    </div>

    <div id="mobile-top-bar"> 
        <div class="mobile-actions">
            <a href="../index.html" class="mobile-nav-btn" id="mobile-back-btn">[BACK]</a>
            <button class="mobile-nav-btn" id="mobile-info-btn">[INFO]</button>
            <button class="mobile-nav-btn" id="mobile-stats-btn">[STATS]</button>
        </div>
    </div>

    <!-- LEFT CONTAINER -->
    <div id="left-container">
        
        <a href="../index.html" class="tech-link mobile-hide" style="display: inline-block; margin-bottom: 40px; font-size: 0.85rem; letter-spacing: 1px; text-decoration: none; opacity: 0.7;">
            [BACK]
        </a>

        <!-- STATS AND SPHERE -->
        <div id="panel-stats" class="panel-box tech-text">
                    
                    <!-- Statis -->
                    <div id="stats-panel" class="mobile-popover" style="display: flex; flex-direction: column; gap: 6px;">
                        <strong class="mobile-hide">STATISTICS</strong>
                        <div>FPS: <span id="fps" class="stat-val">0</span></div>
                        <div>Total Tris: <span id="tris" class="stat-val">0</span></div>
                        <div>Total Verts: <span id="verts" class="stat-val">0</span></div>
                        <div>Total Size: <span id="fileSize" class="stat-val">Calculating...</span></div>
                    </div>
                    
                    <!-- Sphere -->
                    <div id="wireframe-btn" class="geometry-trigger" style="cursor: pointer; pointer-events: auto; width: fit-content;">
                        <div class="wireframe-sphere-mesh">
                            <div class="sphere-ring ring-h"></div>
                            <div class="sphere-ring ring-v1"></div>
                            <div class="sphere-ring ring-v2"></div>
                        </div>
                    </div>
                </div>

        <!-- SLIDERS -->
        <div id="panel-sliders" class="panel-box" style="margin-top: 50px; margin-bottom: 40px;">
            <div id="face-controls" class="panel-section active">
                <div class="slider-group" style="margin-top: 0;">
                    <div class="slider-label"><span>RESHAPE_DORSAL_HUMP</span> <span id="humpVal" class="slider-val">1.00</span></div>
                    <input type="range" id="humpSlider" class="face-slider" min="0" max="1" step="0.01" value="1">
                </div>
                
                <div class="slider-group" style="margin-top: 24px;">
                    <div class="slider-label"><span>RECONSTRUCT_CHIN</span> <span id="chinVal" class="slider-val">1.00</span></div>
                    <input type="range" id="chinSlider" class="face-slider" min="0" max="1" step="0.01" value="1">
                </div>
                
                <div class="slider-group" style="margin-top: 24px;">
                    <div class="slider-label"><span>REDUCE_SUBMENTAL_FAT</span> <span id="fatVal" class="slider-val">1.00</span></div>
                    <input type="range" id="fatSlider" class="face-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>

        <!-- INFO PANEL -->
        <div id="info-panel" class="project-metadata-log mobile-popover">
            <span id="type-body"></span>
        </div>

    </div> 

    <canvas id="renderCanvas"></canvas>

    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
