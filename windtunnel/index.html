<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aero Wind Tunnel | nesh19</title>
    
    <link rel="stylesheet" href="../style.css">

    <style>
        /* ZAŠTITA DESKTOP LAYOUTA: Ovi stilovi se primjenjuju samo na velikim ekranima */
        @media (min-width: 1367px) {
            #left-container {
                overflow-y: auto !important;
                scrollbar-width: none;
                box-sizing: border-box;
                height: calc(100vh - 80px); 
                padding-bottom: 10px !important; 
            }
            #left-container::-webkit-scrollbar { display: none; }
        }
    </style>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div>LOADING GEOMETRY & TEXTURES...</div>
        <div style="font-size: 10px; color: var(--dim-blue); margin-top: 10px;">Please wait</div>
    </div>

    <div id="crash-screen" style="display: none;">
        <h2 style="margin-top:0;">⚠️ MODEL LOAD FAILED</h2>
        <p id="crash-log">Check your models folder.</p>
    </div>

    <!-- DESKTOP MENI -->
    <div id="floating-toolbar">
        <a href="../index.html" class="tool-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Main Menu</a>
        <button class="tool-btn" data-panel="stats">Stats</button>
    </div>
    <button id="ui-toggle-btn">HIDE UI</button>

    <!-- MOBILNI GORNJI MENI (Dodan po uzoru na Cortisol) -->
    <div id="mobile-top-bar"> 
        <div class="mobile-actions">
            <a href="../index.html" class="mobile-nav-btn" id="mobile-back-btn">[BACK]</a>
            <button class="mobile-nav-btn" id="mobile-info-btn">[INFO]</button>
            <button class="mobile-nav-btn" id="mobile-stats-btn">[STATS]</button>
        </div>
    </div>

    <!-- GLAVNI LEVI KONTEJNER (Dodan drone-layout za moguće CSS korekcije) -->
    <div id="left-container" class="drone-layout">
        
        <!-- Povratak nazad -->
        <a href="../index.html" class="tech-link mobile-hide" style="display: inline-block; margin-bottom: 40px; font-size: 0.85rem; letter-spacing: 1px; text-decoration: none; opacity: 0.7;">
            [BACK]
        </a>

        <!-- STATISTIKA I SFERA -->
        <div id="panel-stats" class="panel-box tech-text">
            
            <!-- STATS PANEL (Pretvoren u mobilni popover) -->
            <div id="stats-panel" class="mobile-popover" style="display: flex; flex-direction: column; gap: 6px;">
                <strong class="mobile-hide">STATISTICS</strong>
                <div>FPS: <span id="fps" class="stat-val">0</span></div>
                <div>Total Tris: <span id="tris" class="stat-val">0</span></div>
                <div>Total Verts: <span id="verts" class="stat-val">0</span></div>
                <div>Total Size: <span id="fileSize" class="stat-val">Calculating...</span></div>
            </div>
            
            <!-- SFERA -->
            <div id="wireframe-btn" class="geometry-trigger" style="margin-top: 24px; margin-bottom: 10px; cursor: pointer; pointer-events: auto; width: fit-content;">
                <div class="wireframe-sphere-mesh">
                    <div class="sphere-ring ring-h"></div>
                    <div class="sphere-ring ring-v1"></div>
                    <div class="sphere-ring ring-v2"></div>
                </div>
            </div>
        </div> 

       <!-- AERODINAMIKA I SLAJDER -->
        <div id="panel-sliders" class="panel-box">
            <div id="aero-controls" class="panel-section active">
                
                <!-- AERO VRIJEDNOSTI (Ostavljeno vidljivo iznad slajdera) -->
                <div style="font-family: 'Roboto Mono', monospace; font-size: 0.72rem; color: var(--dim-blue); margin-bottom: 25px; line-height: 1.8; letter-spacing: 1px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>WIND SPEED:</span> 
                        <span id="wind-speed-text" style="color: var(--neon-blue); font-weight: bold; text-shadow: 0 0 5px var(--hologram-glow);">1.0 m/s</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>REYNOLDS NO:</span> 
                        <span id="reynolds-text" style="color: var(--neon-blue); font-weight: bold; text-shadow: 0 0 5px var(--hologram-glow);">7.50E+4</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>FLOW REGIME:</span>
                        <span id="flow-status-text" style="color: var(--neon-blue); font-weight: bold; text-shadow: 0 0 5px var(--hologram-glow);">LAMINAR</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>VORTEX INTENSITY:</span>
                        <span id="vortex-text" style="color: var(--neon-blue); font-weight: bold; text-shadow: 0 0 5px var(--hologram-glow);">0%</span>
                    </div>
                </div>

                <!-- SLAJDER (Margina teksta prilagođena Cortisol primjeru) -->
                <div class="slider-group" style="margin-top: 0; position: relative;">
                    <div class="slider-label" style="justify-content: flex-start; color: var(--danger-red); letter-spacing: 1px; font-weight: bold; margin-bottom: 5px;">ACTIVE AERODYNAMICS</div>
                    <input type="range" id="brakeSlider" class="stress-slider" min="0" max="1" step="0.01" value="0" style="position: relative; z-index: 2;">
                </div>
                
            </div>
        </div>

        <!-- INFO PANEL & TELETYPE (Pretvoren u mobilni popover) -->
        <div id="info-panel" class="project-metadata-log mobile-popover" style="opacity: 0.85; font-size: 0.75rem; line-height: 1.6; color: var(--dim-blue);">
            <span id="type-body"></span>
        </div>

    </div> 

    <canvas id="renderCanvas"></canvas>

    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
